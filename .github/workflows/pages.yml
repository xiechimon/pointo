name: pages

# The site also serves the latest release's downloads (releases/), because GitHub's release
# download host (release-assets.githubusercontent.com) is unreachable from many networks in
# mainland China while *.github.io is not. It redeploys from main only (the github-pages
# environment rejects tag refs): the release script's appcast commit picks up the new macOS
# assets, and the Windows workflow finishing picks up the installer.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Release (Windows)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: site
        run: bun run build
      - name: Latest release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/dist/releases
          gh release download --repo "$GITHUB_REPOSITORY" --dir site/dist/releases \
            --pattern '*-arm64.dmg' --pattern '*-arm64.zip' --pattern '*-windows-x64-setup.exe' || true
          cd site/dist/releases
          win=$(ls *-windows-x64-setup.exe 2>/dev/null | grep -v latest | head -1 || true)
          if [ -n "$win" ]; then cp "$win" Pointo-latest-windows-x64-setup.exe; fi
          ls -la
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
