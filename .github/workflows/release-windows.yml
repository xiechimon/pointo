name: Release (Windows)

# Builds the Windows zip for a version tag and attaches it to that tag's GitHub release
# (creating the release if the Mac side hasn't yet). A release/** branch only builds it, as a
# dry run. Run it by hand with a tag to rebuild one, or without a tag to only build the zip and
# keep it as a workflow artifact.

on:
  push:
    tags: ["v*"]
    # A release branch builds the zip as a dry run, without uploading it.
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach the zip to (e.g. v0.3.6). Empty builds the branch without uploading.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}-${{ inputs.tag }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      BUILD: --release --locked --target x86_64-pc-windows-msvc
      EXE: target\x86_64-pc-windows-msvc\release\pointo.exe
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          cache-on-failure: true

      - run: cargo build ${{ env.BUILD }}

      - name: pointo --help runs headless
        run: '& $env:EXE --help'

      - name: No AVX-512 outside the CPU backends that need it
        run: scripts\check-windows-cpu-tiers.ps1 target\x86_64-pc-windows-msvc\release

      # transcribe.cpp builds against the DLL C runtime, so the Visual C++ runtime DLLs pointo.exe
      # and transcribe.cpp's DLLs import go beside them in the zip (app-local, as Microsoft
      # allows): a fresh Windows has no Visual C++ redistributable.
      # A fresh runner has no Pointo config, so the app opens the welcome window. Pointo leaves its
      # own windows out of screen captures unless SCRAWL_SHOW_OWN_WINDOWS is set.
      - name: The welcome window opens on a fresh profile
        shell: pwsh
        env:
          SCRAWL_SHOW_OWN_WINDOWS: "1"
        run: |
          $app = Start-Process -FilePath $env:EXE -ArgumentList "app" -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw "Pointo exited with code $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force dist | Out-Null
          $bitmap.Save("dist\welcome.png")
          Stop-Process -Id $app.Id -Force
          $log = Join-Path $env:LOCALAPPDATA "Pointo\Logs\pointo.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "onboarding: could not decode state" -Quiet)) {
            throw "the welcome window rejected the onboarding state"
          }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: welcome-window
          path: dist/welcome.png
          if-no-files-found: warn

      - name: Collect the Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $files = @($env:EXE) + (Get-ChildItem target\x86_64-pc-windows-msvc\release\transcribe.dll, target\x86_64-pc-windows-msvc\release\ggml*.dll).FullName
          $deps = $files | ForEach-Object { & $dumpbin.FullName /nologo /dependents $_ } | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() } | Sort-Object -Unique
          "imports:"; $deps
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          "runtime from $($crt.FullName)"
          New-Item -ItemType Directory -Force runtime | Out-Null
          foreach ($dll in $deps | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vcomp)' }) {
            $file = Join-Path $crt.FullName $dll
            if (-not (Test-Path $file)) { throw "no $dll in $($crt.FullName)" }
            Copy-Item $file runtime\
          }
          Get-ChildItem runtime | Format-Table Name, Length

      - name: Downloads and runs the speech model
        env:
          POINTO_TEST_MODEL_DIR: ${{ runner.temp }}\speech-model
        run: cargo test ${{ env.BUILD }} local_asr::tests::downloads_and_runs_qwen -- --exact --ignored --nocapture

      # The runner has AVX-512; Intel SDE runs the model again as a Lunar Lake CPU (AVX2 and
      # AVX-VNNI, no AVX-512), the one that crashed in #58. ggml then loads the alderlake backend.
      - uses: petarpetrovt/setup-sde@v6.0
      - name: Runs the speech model on a CPU without AVX-512
        timeout-minutes: 30
        shell: pwsh
        env:
          POINTO_TEST_MODEL_DIR: ${{ runner.temp }}\speech-model
          POINTO_TEST_NO_AVX512: "1"
        run: |
          $test = cargo test ${{ env.BUILD }} --bin pointo --no-run --message-format=json |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq "compiler-artifact" -and $_.target.name -eq "pointo" -and $_.profile.test } |
            Select-Object -ExpandProperty executable -First 1
          "test binary: $test"
          # Current Cargo puts test binaries under build\<pkg>\<hash>\out, away from the DLLs that
          # build.rs stages beside pointo.exe; `cargo test` adds that folder to PATH, SDE doesn't.
          $env:PATH = "$(Resolve-Path target\x86_64-pc-windows-msvc\release);$env:PATH"
          $sde = Get-ChildItem $env:SDE_PATH -Recurse -Filter sde.exe | Select-Object -First 1
          & $sde.FullName -lnl -- $test local_asr::tests::downloads_and_runs_qwen --exact --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw "failed under SDE -lnl (exit $LASTEXITCODE)" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $dir = "dist\Pointo"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $env:EXE "$dir\pointo.exe"
          Copy-Item target\x86_64-pc-windows-msvc\release\transcribe.dll, target\x86_64-pc-windows-msvc\release\ggml*.dll $dir
          Copy-Item runtime\*.dll $dir
          Copy-Item LICENSE "$dir\LICENSE.txt"
          "version=$version" >> $env:GITHUB_OUTPUT

      # The installer (packaging/windows/Pointo.iss): per-user, Simplified Chinese, Start menu and
      # desktop shortcuts, and an optional step that downloads the speech model with progress.
      - name: Build the installer
        id: installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6" -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6" -Filter ISCC.exe | Select-Object -First 1 }
          & $iscc.FullName "/DAppVersion=${{ steps.package.outputs.version }}" "/DSourceDir=$PWD\dist\Pointo" "/DRepoDir=$PWD" "/DOutputDir=$PWD\dist" packaging\windows\Pointo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $name = "Pointo-${{ steps.package.outputs.version }}-windows-x64-setup.exe"
          Get-ChildItem "dist\$name" | Format-Table Name, Length
          (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower() + "  $name" | Tee-Object "dist\$name.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Check the installer
        shell: pwsh
        run: |
          $setup = "dist\${{ steps.installer.outputs.name }}"
          $target = "$env:RUNNER_TEMP\pointo-install"
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target" -Wait
          Get-ChildItem $target | Format-Table Name, Length
          & "$target\pointo.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed pointo.exe failed ($LASTEXITCODE)" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'Pointo.lnk'
          if (-not $lnk) { throw "no Start menu shortcut" }
          $uninstaller = Get-ChildItem $target -Filter 'unins*.exe' | Select-Object -First 1
          Start-Process $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 3
          if (Test-Path "$target\pointo.exe") { throw "uninstall left pointo.exe behind" }

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.installer.outputs.name }}
          path: |
            dist/${{ steps.installer.outputs.name }}
            dist/${{ steps.installer.outputs.name }}.sha256

      - name: Attach to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Pointo ${TAG#v}" --notes "Release notes to follow."
          gh release upload "$TAG" "dist/${{ steps.installer.outputs.name }}" "dist/${{ steps.installer.outputs.name }}.sha256" --clobber
